name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug-apk:
    name: Build Timber Wing Debug APK
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22 LTS
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Java JDK 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: 'tools platform-tools platforms;android-36 build-tools;36.0.0'

      - name: Setup Gradle with Dependency Caching
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Install dependencies deterministically
        run: bun install --frozen-lockfile

      - name: Validate TypeScript
        run: bun run lint

      - name: Build production web bundle
        run: bun run build

      - name: Verify production dist output
        run: |
          if [ ! -f "dist/index.html" ]; then
            echo "Error: dist/index.html was not generated by web build."
            exit 1
          fi
          ls -la dist

      - name: Sync Capacitor Android project
        run: npx cap sync android

      - name: Ensure Gradle Wrapper is executable
        run: chmod +x android/gradlew

      - name: Build Android Debug APK
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Verify generated Debug APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ]; then
            echo "Error: Expected APK not found at $APK_PATH"
            exit 1
          fi
          echo "Debug APK successfully verified:"
          ls -lh "$APK_PATH"

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: timber-wing-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
          if-no-files-found: error
